name: iOS build

# 只在推 build-* 標籤時才編譯，平常推程式不會動到雲端的 Mac。
on:
  push:
    tags:
      - "build-*"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if 'iPhone' in d['name']))
          ")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Luodu.xcodeproj \
            -scheme Luodu \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error|warning: unre|Test Case|Test Suite|BUILD|TEST|\*\*" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
